<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Merry Christmas, Akari</title>
<meta name="description" content="A little Christmas sky for Akari.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root {
    --champ: #ecd9ae;
    --cream: #fff6e8;
    --safe-t: max(12px, env(safe-area-inset-top));
    --safe-b: max(14px, env(safe-area-inset-bottom));
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden; overscroll-behavior: none;
    background: #000; color: #f3f6ff;
    font-family: "Cormorant Garamond", Georgia, serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent; touch-action: none;
  }
  body { position: fixed; inset: 0; }
  .bg { position: fixed; inset: 0; z-index: 0; background: radial-gradient(120% 70% at 50% 100%, #0e1433 0%, #060818 45%, #010104 100%); }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; display: block; }
  #safe { position: fixed; left: 0; top: 0; width: 1px; height: env(safe-area-inset-top, 0px); visibility: hidden; pointer-events: none; }

  .hint {
    position: fixed; left: 16px; right: 16px; bottom: calc(var(--safe-b) + 16px); z-index: 24; text-align: center;
    font-style: italic; font-size: 15px; letter-spacing: .04em; color: rgba(240, 244, 255, .86);
    text-shadow: 0 0 6px rgba(0, 0, 10, .9), 0 1px 14px rgba(0, 0, 10, .8);
    opacity: 0; transition: opacity 1.4s ease; pointer-events: none;
  }
  .hint.show { opacity: 1; }

  /* ---------- Begin screen ---------- */
  .begin {
    position: fixed; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    text-align: center; padding: 24px; cursor: pointer; transition: opacity 1.6s ease, visibility 0s 1.6s;
  }
  .begin.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  .begin .kicker { opacity: 0; animation: rise 1.4s ease .3s forwards; }
  .begin .script {
    opacity: 0; padding: 0 .3em .05em;
    background: linear-gradient(100deg, #c9a463 0%, #ecd9ae 24%, #fffaf0 34%, #ecd9ae 44%, #c9a463 64%, #e6cf9d 100%);
    background-size: 240% 100%; background-position: 100% 0;
    -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none;
    filter: drop-shadow(0 0 14px rgba(255, 214, 150, .4));
    animation: rise 1.6s ease .7s forwards, sheen 5s ease-in-out 2.4s infinite;
  }
  .begin .go {
    margin-top: 36px; font-family: "Cinzel", serif; font-size: 12.5px; letter-spacing: .48em; padding-left: .48em; text-transform: uppercase; color: var(--cream);
    opacity: 0; animation: rise 1.2s ease 1.4s forwards, breathe 2.8s ease-in-out 2.6s infinite;
  }
  .begin small { margin-top: 12px; font-size: 15px; font-style: italic; color: rgba(225, 232, 255, .5); opacity: 0; animation: rise 1.2s ease 1.8s forwards; }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .kicker { font-family: "Cinzel", serif; font-weight: 500; font-size: 12.5px; letter-spacing: .4em; padding-left: .4em; text-transform: uppercase; color: var(--champ); }
  .script { font-family: "Great Vibes", cursive; font-weight: 400; line-height: 1.05; color: var(--cream); font-size: clamp(64px, 21vw, 116px); }

  /* ---------- Lettering ---------- */
  .banner {
    position: fixed; left: 0; right: 0; top: calc(var(--safe-t) + 14px); z-index: 5; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .b-top {
    font-family: "Cinzel", serif; font-weight: 600; font-size: clamp(12px, 3.6vw, 17px); letter-spacing: .72em; padding-left: .72em;
    color: var(--champ); text-shadow: 0 0 14px rgba(255, 226, 170, .45); opacity: 0;
  }
  .ink {
    -webkit-mask-image: linear-gradient(90deg, #000 55%, transparent 62%); mask-image: linear-gradient(90deg, #000 55%, transparent 62%);
    -webkit-mask-size: 300% 100%; mask-size: 300% 100%; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-position: 100% 0; mask-position: 100% 0;
  }
  .b-script {
    font-family: "Great Vibes", cursive; font-weight: 400; line-height: 1; color: #fbfcff;
    font-size: clamp(54px, min(16.5vw, 9vh), 104px); padding: .12em .35em .05em;
    text-shadow: 0 0 10px rgba(255, 255, 255, .45), 0 0 34px rgba(170, 200, 255, .35);
  }
  .flourish { width: min(62vw, 270px); height: 22px; margin-top: -6px; overflow: visible; }
  .flourish path { fill: none; stroke: var(--champ); stroke-width: 1.2; stroke-linecap: round; stroke-dasharray: 520; stroke-dashoffset: 520; filter: drop-shadow(0 0 4px rgba(255, 220, 160, .7)); }
  .b-name {
    font-family: "Great Vibes", cursive; font-weight: 400; line-height: 1; margin-top: -.2em; padding: .14em .4em .12em;
    font-size: clamp(56px, min(17.5vw, 9.6vh), 110px);
    background: linear-gradient(100deg, #c9a463 0%, #ecd9ae 22%, #fffaf0 32%, #ecd9ae 42%, #c9a463 62%, #e6cf9d 100%);
    background-size: 240% 100%; background-position: 100% 0;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 12px rgba(255, 214, 150, .45));
  }
  .b-sub { margin-top: -4px; font-style: italic; font-size: clamp(15px, 4.2vw, 19px); letter-spacing: .02em; color: rgba(232, 238, 255, .8); opacity: 0; }
  body.p-text .b-top { animation: track 1.8s cubic-bezier(.2,.8,.2,1) forwards; }
  body.p-text .b-script { animation: ink 3.2s linear .3s both; }
  body.p-text .flourish path { animation: draw 1.8s ease-out 1.5s forwards; }
  body.p-text .b-name { animation: ink 3.2s linear 1.9s both, sheen 6s ease-in-out 5.2s infinite; }
  body.p-text .b-sub { animation: rise 1.4s ease 4s forwards; }
  @keyframes track { from { opacity: 0; letter-spacing: 1.3em; } to { opacity: 1; letter-spacing: .72em; } }
  @keyframes ink { from { -webkit-mask-position: 100% 0; mask-position: 100% 0; } to { -webkit-mask-position: 0 0; mask-position: 0 0; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes sheen { 0% { background-position: 100% 0; } 60%, 100% { background-position: 0 0; } }
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="safe" aria-hidden="true"></div>

<div class="banner">
  <span class="b-top">Merry</span>
  <h1 class="b-script ink">Christmas</h1>
  <svg class="flourish" viewBox="0 0 280 24" aria-hidden="true">
    <path d="M6 14 C 40 4, 70 22, 110 12 S 130 2, 140 12 S 150 22, 170 12 S 240 4, 274 14"/>
  </svg>
  <span class="b-name ink">Akari</span>
  <span class="b-sub">&amp; a magical New Year together</span>
</div>

<div class="begin" id="begin" role="button" tabindex="0" aria-label="Tap to begin">
  <p class="kicker">A Christmas sky for</p>
  <p class="script">Akari</p>
  <p class="go">Tap to begin</p>
  <small>turn your sound on</small>
</div>

<p class="hint" id="hint" aria-live="polite"></p>

<script>
(() => {
  "use strict";
  const $ = s => document.querySelector(s);
  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const ease = t => 1 - Math.pow(1 - t, 3);
  const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const easeBack = t => { const c = 1.3; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const gauss = R => { let u = 0, v = 0; while (!u) u = R(); while (!v) v = R(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(TAU * v); };
  const mk = (w, h) => { const c = document.createElement("canvas"); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };
  const shade = (c, k) => `rgb(${Math.min(255, c[0] * k) | 0},${Math.min(255, c[1] * k) | 0},${Math.min(255, c[2] * k) | 0})`;
  const mixc = (a, b, f) => `rgb(${a[0] + (b[0] - a[0]) * f | 0},${a[1] + (b[1] - a[1]) * f | 0},${a[2] + (b[2] - a[2]) * f | 0})`;
  function makeNoise(R) { const v = Array.from({ length: 512 }, () => R() * 2 - 1); return x => { const i = Math.floor(x), f = x - i, a = v[i & 511], b = v[(i + 1) & 511]; return a + (b - a) * f * f * (3 - 2 * f); }; }

  /* ================= Canvas, palette, sprites ================= */
  const cv = $("#fx"), ctx = cv.getContext("2d");
  let W = 0, H = 0, DPR = 1, GT = 0;
  const M = 30; // extra margin around the landscape layers so the camera never shows an edge
  const PAL = {
    white: [236, 242, 255], cream: [255, 244, 226], warm: [255, 232, 200], bulb: [255, 214, 160], amber: [255, 186, 110],
    gold: [244, 214, 152], champ: [236, 212, 168], rose: [244, 166, 186], ice: [196, 218, 255]
  };
  const sprites = {};
  function sprite(name) {
    if (sprites[name]) return sprites[name];
    const [r, g, b] = PAL[name], s = 64, c = mk(s, s), x = c.getContext("2d");
    const gr = x.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
    gr.addColorStop(0, "rgba(255,255,255,1)");
    gr.addColorStop(.12, `rgba(${r},${g},${b},1)`);
    gr.addColorStop(.35, `rgba(${r},${g},${b},.33)`);
    gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
    x.fillStyle = gr; x.fillRect(0, 0, s, s);
    return (sprites[name] = c);
  }
  function glow(name, x, y, size, a) {
    if (a <= .01 || size <= .2) return;
    ctx.globalAlpha = a > 1 ? 1 : a;
    ctx.drawImage(sprite(name), x - size, y - size, size * 2, size * 2);
  }
  const cache = {};
  function radialSprite(key, w, h, stops) {
    if (cache[key]) return cache[key];
    const c = mk(w, h), g = c.getContext("2d");
    g.translate(w / 2, h / 2); g.scale(1, h / w);
    const gr = g.createRadialGradient(0, 0, 0, 0, 0, w / 2);
    for (const [s, col] of stops) gr.addColorStop(s, col);
    g.fillStyle = gr; g.beginPath(); g.arc(0, 0, w / 2, 0, TAU); g.fill();
    return (cache[key] = c);
  }
  const soft = () => radialSprite("soft", 32, 32, [[0, "rgba(255,255,255,1)"], [.45, "rgba(255,255,255,.7)"], [1, "rgba(255,255,255,0)"]]);
  const pool = () => radialSprite("pool", 256, 64, [[0, "rgba(255,200,135,.95)"], [.4, "rgba(255,186,110,.35)"], [1, "rgba(255,186,110,0)"]]);
  const mound = () => radialSprite("mound", 256, 64, [[0, "rgba(214,223,248,1)"], [.55, "rgba(200,211,242,.85)"], [1, "rgba(190,202,238,0)"]]);
  const fog = () => radialSprite("fog", 256, 64, [[0, "rgba(200,215,255,.55)"], [1, "rgba(200,215,255,0)"]]);
  const treeGlow = () => radialSprite("tglow", 128, 192, [[0, "rgba(255,190,120,.9)"], [.5, "rgba(255,170,100,.3)"], [1, "rgba(255,170,100,0)"]]);
  const shadowBlob = () => radialSprite("shb", 64, 16, [[0, "rgba(8,12,34,.75)"], [1, "rgba(8,12,34,0)"]]);
  function spikeSprite() {
    if (cache.spike) return cache.spike;
    const c = mk(256, 16), x = c.getContext("2d");
    let g = x.createLinearGradient(0, 0, 256, 0);
    [[0, 0], [.3, .05], [.44, .3], [.5, 1], [.56, .3], [.7, .05], [1, 0]].forEach(([s, a]) => g.addColorStop(s, `rgba(255,248,232,${a})`));
    x.fillStyle = g; x.fillRect(0, 0, 256, 16);
    x.globalCompositeOperation = "destination-in";
    g = x.createLinearGradient(0, 0, 0, 16); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(.5, "rgba(0,0,0,1)"); g.addColorStop(1, "rgba(0,0,0,0)");
    x.fillStyle = g; x.fillRect(0, 0, 256, 16);
    return (cache.spike = c);
  }
  function drawSpike(x, y, ang, len, w, a) {
    if (a <= .01 || len <= 1) return;
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.globalAlpha = Math.min(1, a);
    ctx.drawImage(spikeSprite(), -len, -w / 2, len * 2, w); ctx.restore();
  }
  function stripSprite(stops) {
    const c = mk(8, 256), x = c.getContext("2d"), g = x.createLinearGradient(0, 0, 0, 256);
    for (const [s, rgb, a] of stops) g.addColorStop(s, `rgba(${rgb},${a})`);
    x.fillStyle = g; x.fillRect(0, 0, 8, 256); return c;
  }
  function ornSprite() {
    if (cache.orn) return cache.orn;
    const S = 64, c = mk(S, S), g = c.getContext("2d"), m = S / 2, r = S * .34;
    g.shadowColor = "rgba(255,226,170,.9)"; g.shadowBlur = 6;
    g.strokeStyle = "#f1e2bd"; g.lineWidth = 1.8; g.lineJoin = "round";
    g.beginPath();
    for (let i = 0; i < 16; i++) { const a = i * TAU / 16 - Math.PI / 2, rr = i % 2 ? r * .36 : r; g.lineTo(m + Math.cos(a) * rr, m + Math.sin(a) * rr); }
    g.closePath(); g.stroke();
    g.fillStyle = "#f7ecd0"; g.beginPath(); g.arc(m, m, r * .13, 0, TAU); g.fill();
    return (cache.orn = c);
  }
  function crystalSprite(v) { // a real six-fold snow crystal
    const key = "cr" + v;
    if (cache[key]) return cache[key];
    const S = 96, c = mk(S, S), g = c.getContext("2d"), arm = S * .42;
    g.translate(S / 2, S / 2); g.lineCap = "round"; g.lineJoin = "round";
    g.shadowColor = "rgba(190,215,255,.9)"; g.shadowBlur = 5; g.strokeStyle = "rgba(244,248,255,.95)";
    const br = v ? [[.3, .3], [.52, .26], [.72, .18], [.88, .1]] : [[.36, .36], [.62, .24], [.82, .14]];
    for (let k = 0; k < 6; k++) {
      g.save(); g.rotate(k * TAU / 6);
      g.lineWidth = 2.2; g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -arm); g.stroke();
      g.lineWidth = 1.5;
      for (const [p, L] of br) { const y = -arm * p, l = arm * L; g.beginPath(); g.moveTo(-l * .7, y - l * .75); g.lineTo(0, y); g.lineTo(l * .7, y - l * .75); g.stroke(); }
      g.beginPath(); g.moveTo(-2.5, -arm + 4); g.lineTo(0, -arm); g.lineTo(2.5, -arm + 4); g.stroke();
      g.restore();
    }
    g.lineWidth = 1.4; g.beginPath();
    for (let k = 0; k < 6; k++) { const a = k * TAU / 6 + Math.PI / 6; g.lineTo(Math.cos(a) * S * .08, Math.sin(a) * S * .08); }
    g.closePath(); g.stroke();
    return (cache[key] = c);
  }

  /* ================= Camera: slow pull-back and layered depth ================= */
  const cam = { z: 1.12, x: 0, y: 0, px: 0, py: 0, tx: 0, ty: 0 }, FOCUS = .62;
  function view(d) {
    const z = 1 + (cam.z - 1) * d, fx = W / 2, fy = H * FOCUS;
    ctx.setTransform(DPR * z, 0, 0, DPR * z, DPR * (fx - fx * z + cam.x * d), DPR * (fy - fy * z + cam.y * d));
  }
  function toWorld(x, y, d = 1) {
    const z = 1 + (cam.z - 1) * d, fx = W / 2, fy = H * FOCUS;
    return [(x - (fx - fx * z + cam.x * d)) / z, (y - (fy - fy * z + cam.y * d)) / z];
  }
  function screenOf(x, y, d = 1) {
    const z = 1 + (cam.z - 1) * d, fx = W / 2, fy = H * FOCUS;
    return [x * z + fx - fx * z + cam.x * d, y * z + fy - fy * z + cam.y * d];
  }

  /* ================= Night sky: milky way + stars ================= */
  let skyCv = null, vigCv = null, twinkles = [], shooters = [];
  function buildSky() {
    const c = mk(W * DPR, H * DPR), g = c.getContext("2d"); g.setTransform(DPR, 0, 0, DPR, 0, 0);
    const R = mulberry32(4242), rr = (a, b) => a + R() * (b - a);
    const ax = -.15 * W, ay = .8 * H, bx = 1.15 * W, by = .02 * H;
    const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy), nx = -dy / len, ny = dx / len;
    const band = s => { const u = R(), o = gauss(R) * s; return [ax + dx * u + nx * o, ay + dy * u + ny * o]; };
    const Mx = Math.max(W, H);
    g.globalCompositeOperation = "lighter";
    for (let i = 0; i < 90; i++) {
      const [x, y] = band(W * .07), rad = rr(.05, .14) * Mx * .5;
      const col = ["110,120,190", "150,125,205", "200,170,160", "120,160,200"][R() * 4 | 0];
      const gr = g.createRadialGradient(x, y, 0, x, y, rad);
      gr.addColorStop(0, `rgba(${col},${rr(.02, .045)})`); gr.addColorStop(1, `rgba(${col},0)`);
      g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
    }
    g.globalCompositeOperation = "destination-out";
    for (let i = 0; i < 46; i++) {
      const [x, y] = band(W * .025), rad = rr(.02, .055) * Mx * .5;
      const gr = g.createRadialGradient(x, y, 0, x, y, rad);
      gr.addColorStop(0, `rgba(0,0,0,${rr(.25, .5)})`); gr.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
    }
    g.globalCompositeOperation = "lighter";
    const tint = () => { const k = R(); return k < .15 ? "200,215,255" : k < .26 ? "255,230,205" : "255,255,255"; };
    const dot = (x, y, r, a, col) => { g.fillStyle = `rgba(${col},${a})`; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); };
    for (let i = 0; i < 1300; i++) { const [x, y] = band(W * .06); dot(x, y, rr(.2, .55), rr(.1, .45), tint()); }
    const n = Math.round(W * H / 650);
    for (let i = 0; i < n; i++) dot(rr(0, W), rr(0, H * .92), rr(.25, .8), rr(.12, .7), tint());
    for (let i = 0; i < 24; i++) {
      const x = rr(0, W), y = rr(0, H * .7), s = rr(2.5, 5), col = tint();
      const gr = g.createRadialGradient(x, y, 0, x, y, s * 2.5);
      gr.addColorStop(0, `rgba(${col},.9)`); gr.addColorStop(.2, `rgba(${col},.22)`); gr.addColorStop(1, `rgba(${col},0)`);
      g.fillStyle = gr; g.fillRect(x - s * 2.5, y - s * 2.5, s * 5, s * 5);
    }
    twinkles = Array.from({ length: 140 }, () => ({ x: rr(0, W), y: rr(0, H * .85), r: rr(.5, 1.3), p: rr(0, TAU), s: rr(.5, 2) }));
    skyCv = c;
    const v = mk(W * DPR / 2, H * DPR / 2), vg = v.getContext("2d"), w2 = v.width, h2 = v.height;
    let gr = vg.createRadialGradient(w2 / 2, h2 * .45, Math.min(w2, h2) * .35, w2 / 2, h2 * .5, Math.hypot(w2, h2) * .62);
    gr.addColorStop(0, "rgba(0,0,6,0)"); gr.addColorStop(1, "rgba(0,0,6,.55)");
    vg.fillStyle = gr; vg.fillRect(0, 0, w2, h2);
    gr = vg.createLinearGradient(0, h2 * .8, 0, h2);
    gr.addColorStop(0, "rgba(0,0,10,0)"); gr.addColorStop(1, "rgba(0,0,10,.45)");
    vg.fillStyle = gr; vg.fillRect(0, 0, w2, h2);
    vigCv = v;
  }
  function drawSky(t, dt) {
    view(.06);
    ctx.globalAlpha = 1; ctx.drawImage(skyCv, 0, 0, W, H);
    ctx.fillStyle = "#fff";
    for (const s of twinkles) { const a = Math.sin(s.p + t * s.s); if (a > 0) { ctx.globalAlpha = a * .8; ctx.fillRect(s.x, s.y, s.r, s.r); } }
    if (Math.random() < .003) shooters.push({ x: rand(0, W * .6), y: rand(0, H * .3), vx: 560, vy: 250, life: 1 });
    ctx.lineCap = "round";
    for (let i = shooters.length - 1; i >= 0; i--) {
      const s = shooters[i]; s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt * 1.2;
      if (s.life <= 0) { shooters.splice(i, 1); continue; }

      for (const gf of this.gifts) {
        if (!gf.landed) continue;
        if (Math.abs(x - gf.x) < gf.bw * .6 + 6 && y < gf.y + 8 && y > gf.y - gf.bh - 16) { gf.hv = -260; burst(gf.x, gf.y - gf.bh, 14, "gold"); ping(gf.note); return; }
      }
      const C = this.world.cab, [cxw, cyw] = toWorld(sx0, sy0, .95);
      if (t > T_CABIN + 1 && Math.abs(cxw - C.x) < C.w * .7 && cyw > C.y - C.ch + 6 && cyw < C.y + 8) {
        C.flare = 1; for (let i = 0; i < 8; i++) this.smoke.push({ x: C.x + C.chim.x, y: C.y + C.chim.y, vx: rand(-3, 6), vy: rand(-26, -14), s: rand(2, 3.5), life: 1 });
        chime(.05); return;
      }
      if (t > T_REVEAL + D_REVEAL && this.hitTree(x, y)) { this.shakeTree(x < cx ? 1 : -1); this.boostAt(x, y, 90); this.knockSnow(x, y); burst(x, y, 14, "gold"); chime(); return; }
      shoot(sx0, sy0); burst(x, y, 10, "gold"); ping(1760);
    }
  };

  const hintEl = $("#hint"); let hintT = null;
  function showHint(msg, ms = 6500) { hintEl.textContent = msg; hintEl.classList.add("show"); clearTimeout(hintT); hintT = setTimeout(() => hintEl.classList.remove("show"), ms); }
  function hideHint() { clearTimeout(hintT); hintEl.classList.remove("show"); }

  const begin = $("#begin");
  function doBegin() {
    if (Scene.begun) return;
    Scene.begun = true;
    begin.classList.add("hide");
    try { audio(); drone(); } catch (_) {}
    Scene.start();
  }
  begin.addEventListener("click", doBegin);
  begin.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") doBegin(); });

  /* Touch: tap things, drag to look around */
  let ptr = null;
  addEventListener("pointerdown", e => {
    if (e.target.closest(".begin")) return;
    ptr = { sx: e.clientX, sy: e.clientY, t: performance.now(), id: e.pointerId };
  });
  addEventListener("pointermove", e => {
    if (!ptr || e.pointerId !== ptr.id) return;
    if (Scene.running) { cam.tx = -clamp((e.clientX - W / 2) / W, -.5, .5) * 24; cam.ty = -clamp((e.clientY - H / 2) / H, -.5, .5) * 14; }
    Scene.move(e.clientX, e.clientY);
  });
  const endPtr = e => {
    if (!ptr || e.pointerId !== ptr.id) return;
    if (Math.hypot(e.clientX - ptr.sx, e.clientY - ptr.sy) < 10 && performance.now() - ptr.t < 450) Scene.tap(e.clientX, e.clientY);
    ptr = null; cam.tx = cam.ty = 0;
  };
  addEventListener("pointerup", endPtr);
  addEventListener("pointercancel", endPtr);
  if (window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission !== "function") {
    let lastShake = 0;
    addEventListener("devicemotion", e => {
      const a = e.accelerationIncludingGravity || e.acceleration; if (!a) return;
      if (Math.hypot(a.x || 0, a.y || 0, a.z || 0) > 22 && performance.now() - lastShake > 280 && Scene.t > T_REVEAL + D_REVEAL) {
        lastShake = performance.now(); Scene.shakeTree(Math.random() < .5 ? 1 : -1); Scene.knockSnow(W / 2, H);
      }
    });
  }

  /* ================= Sound: a music-box "Silent Night" in a warm room, plus winter wind ================= */
  // "Silent Night" (Franz Xaver Gruber, 1818) — public domain. [note, length in eighths]
  const SN = [
    ["G5", 3], ["A5", 1], ["G5", 2], ["E5", 6], ["G5", 3], ["A5", 1], ["G5", 2], ["E5", 6],
    ["D6", 4], ["D6", 2], ["B5", 6], ["C6", 4], ["C6", 2], ["G5", 6],
    ["A5", 4], ["A5", 2], ["C6", 3], ["B5", 1], ["A5", 2], ["G5", 3], ["A5", 1], ["G5", 2], ["E5", 6],
    ["A5", 4], ["A5", 2], ["C6", 3], ["B5", 1], ["A5", 2], ["G5", 3], ["A5", 1], ["G5", 2], ["E5", 6],
    ["D6", 4], ["D6", 2], ["F6", 3], ["D6", 1], ["B5", 2], ["C6", 6], ["E6", 6],
    ["C6", 3], ["G5", 1], ["E5", 2], ["G5", 3], ["F5", 1], ["D5", 2], ["C5", 12]
  ];
  const SN_BARS = "CCCCGGCCFCCCFCCCGGCCCGCC";
  const FQ = { C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, G5: 783.99, A5: 880, B5: 987.77, C6: 1046.5, D6: 1174.66, E6: 1318.51, F6: 1396.91 };
  const CHD = { C: [130.81, 164.81, 196], G: [98, 123.47, 146.83], F: [87.31, 110, 130.81] };
  let actx = null, master = null, sfx = null, verb = null, playing = false, resumeMusic = false, loopTimer = null, windNode = null;
  function audio() {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    if (!sfx) {
      const len = actx.sampleRate * 3 | 0, ir = actx.createBuffer(2, len, actx.sampleRate);
      for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
      verb = actx.createConvolver(); verb.buffer = ir;
      const wet = actx.createGain(); wet.gain.value = .32; verb.connect(wet).connect(actx.destination);
      sfx = actx.createGain(); sfx.gain.value = .75; sfx.connect(actx.destination); sfx.connect(verb);
    }
  }
  function bell(freq, when, dur, vol = .2, out = master || sfx) {
    if (!out) return;
    [[1, "triangle"], [2, "sine"], [3.01, "sine"], [4.2, "sine"]].forEach(([m, type], k) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq * m;
      const v = vol / (k * 2.2 + 1);
      g.gain.setValueAtTime(.0001, when);
      g.gain.exponentialRampToValueAtTime(v, when + .008);
      g.gain.exponentialRampToValueAtTime(.0001, when + dur * 1.6 + .5 - k * .1);
      o.connect(g).connect(out); o.start(when); o.stop(when + dur * 1.6 + .6);
    });
  }
  function pad(freq, when, dur, vol = .035, out = master) {
    if (!out) return;
    [1, 1.5, 2].forEach(m => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = freq * m; o.detune.value = rand(-6, 6);
      g.gain.setValueAtTime(.0001, when);
      g.gain.linearRampToValueAtTime(vol / m, when + Math.min(1.2, dur / 3));
      g.gain.linearRampToValueAtTime(.0001, when + dur + .3);
      o.connect(g).connect(out); o.start(when); o.stop(when + dur + .4);
    });
  }
  function softChord(freqs, when, dur, vol, out = master) {
    if (!out) return;
    for (const f of freqs) {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = f * 2; o.detune.value = rand(-5, 5);
      g.gain.setValueAtTime(.0001, when);
      g.gain.linearRampToValueAtTime(vol, when + .5);
      g.gain.linearRampToValueAtTime(vol * .7, when + dur * .7);
      g.gain.linearRampToValueAtTime(.0001, when + dur + .4);
      o.connect(g).connect(out); o.start(when); o.stop(when + dur + .5);
    }
  }
  function noise(when, len, freq, vol, type = "bandpass") {
    if (!sfx) return;
    const buf = actx.createBuffer(1, Math.ceil(actx.sampleRate * len), actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
    const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    src.buffer = buf; f.type = type; f.frequency.value = freq; f.Q.value = 1.2; g.gain.value = vol;
    src.connect(f).connect(g).connect(sfx); src.start(when);
  }
  function sweep(when, dur, f0, f1, vol) {
    if (!sfx) return;
    const buf = actx.createBuffer(1, Math.ceil(actx.sampleRate * dur), actx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    src.buffer = buf; f.type = "bandpass"; f.Q.value = 2.5;
    f.frequency.setValueAtTime(f0, when); f.frequency.exponentialRampToValueAtTime(f1, when + dur);
    g.gain.setValueAtTime(.0001, when); g.gain.linearRampToValueAtTime(vol, when + dur * .5); g.gain.linearRampToValueAtTime(.0001, when + dur);
    src.connect(f).connect(g).connect(sfx); src.start(when); src.stop(when + dur + .05);
  }
  function loop() {
    if (!master) return;
    const e = .24, start = actx.currentTime + .1; let when = start;
    for (const [n, d] of SN) { bell(FQ[n], when, Math.min(d * e, 1.2), .12, master); when += d * e; }
    for (let b = 0; b < SN_BARS.length; b++) {
      const ch = CHD[SN_BARS[b]], tb = start + b * 6 * e;
      bell(ch[0], tb, .9, .045, master);
      softChord(ch, tb, 6 * e, .012);
    }
    loopTimer = setTimeout(() => playing && loop(), (when - start) * 1000 - 60);
  }
  function startMusic() {
    try { audio(); } catch (_) { return; }
    if (playing) return;
    master = actx.createGain(); master.gain.value = .55; master.connect(actx.destination); master.connect(verb);
    playing = true; loop();
  }
  function stopMusic() {
    playing = false; clearTimeout(loopTimer);
    if (master) { const old = master; old.gain.setTargetAtTime(0, actx.currentTime, .06); setTimeout(() => old.disconnect(), 500); master = null; }
  }
  function drone() {
    const t = actx.currentTime;
    pad(65.41, t, 9, .05, sfx); pad(98, t + 2, 8, .03, sfx);
    sweep(t + T_REVEAL, D_REVEAL, 300, 2600, .05);
    const steps = [1, 9 / 8, 5 / 4, 3 / 2, 5 / 3, 2, 9 / 4, 5 / 2, 3, 10 / 3, 4];
    steps.forEach((m, i) => bell(523.25 * m, t + T_LIGHT - .2 + i * 1.6 / steps.length, .25, .035, sfx));
  }
  function ignite(again) {
    if (!sfx) return;
    const t = actx.currentTime;
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => bell(f, t + i * .04, .9, .08, sfx));
    pad(130.81, t, 2.5, .05, sfx);
    noise(t, 1.2, 3000, .09, "highpass");
    if (!again) setTimeout(startMusic, 900);
  }
  function windOn() {
    if (!sfx || windNode) return;
    const len = 6, buf = actx.createBuffer(1, actx.sampleRate * len, actx.sampleRate), d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < d.length; i++) { last = (last + .02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
    const fade = actx.sampleRate * .3 | 0;
    for (let i = 0; i < fade; i++) { const k = i / fade; d[i] *= k; d[d.length - 1 - i] *= k; }
    const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain(), lfo = actx.createOscillator(), lg = actx.createGain();
    src.buffer = buf; src.loop = true; f.type = "lowpass"; f.frequency.value = 520;
    lfo.frequency.value = .08; lg.gain.value = 260; lfo.connect(lg).connect(f.frequency); lfo.start();
    g.gain.setValueAtTime(.0001, actx.currentTime); g.gain.linearRampToValueAtTime(.06, actx.currentTime + 5);
    src.connect(f).connect(g).connect(sfx); src.start();
    windNode = src;
  }
  function swell() { if (sfx) { const t = actx.currentTime; pad(65.41, t, 6, .07, sfx); pad(98, t + .6, 6, .05, sfx); } }
  function arpeggio(notes, gap, vol) { if (!sfx) return; const t = actx.currentTime; notes.forEach((f, i) => bell(f, t + i * gap, .4, vol, sfx)); }
  function whoosh() { if (sfx) noise(actx.currentTime, 1.6, 700, .2); }
  function jingle(dur, vol = 1) {
    if (!sfx) return;
    const t0 = actx.currentTime;
    for (let s = 0; s < dur; s += .11) {
      const v = (.022 * Math.sin(Math.PI * s / dur) + .004) * vol;
      bell(rand(2300, 3300), t0 + s + rand(0, .03), .05, v, sfx);
      if (Math.random() < .5) noise(t0 + s, .05, 6000, v * 3, "highpass");
    }
  }
  function ping(f, vol = .05) { if (sfx) bell(f, actx.currentTime, .3, vol, sfx); }
  function chime(vol = .06) { if (sfx) { const t = actx.currentTime; [1046.5, 1318.5, 1568].forEach((f, i) => bell(f, t + i * .07, .3, vol, sfx)); } }
  document.addEventListener("visibilitychange", () => {
    if (!actx) return;
    if (document.hidden) { if (playing) { stopMusic(); resumeMusic = true; } actx.suspend(); }
    else { actx.resume(); if (resumeMusic) { resumeMusic = false; startMusic(); } }
  });

  /* ================= Frame loop ================= */
  let lastW = 0, lastH = 0;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    if (W === lastW && H === lastH && Scene.tree) return;
    lastW = W; lastH = H;
    buildSky(); initSnow();
    if (Scene.t > T_SNOW) startSnowfall();
    Scene.topY = ($("#safe").offsetHeight || 0) + 4;
    Scene.build();
    if (Scene.t >= T_REVEAL + D_REVEAL) for (const p of Scene.P) p.cov = -10;
    if (Scene.t >= T_GIFTS + 3) for (const g of Scene.gifts) g.landed = true;
    Scene.textRects = null;
  }
  function updateCam(dt) {
    const t = Scene.running ? Scene.t : 0, idle = Scene.running ? clamp((t - T_DONE) / 5) : 0;
    cam.z = 1 + .12 * (1 - easeIO(clamp(t / T_PULL)));
    cam.px += (cam.tx - cam.px) * Math.min(1, dt * 2.5);
    cam.py += (cam.ty - cam.py) * Math.min(1, dt * 2.5);
    cam.x = cam.px + idle * (4 * Math.sin(GT * .11) + 2 * Math.sin(GT * .23 + 1));
    cam.y = cam.py + idle * 2.5 * Math.sin(GT * .09 + 2);
  }
  let last = performance.now();
  function frame(now) {
    const dt = clamp((now - last) / 1000, 0, .05); last = now; GT += dt;
    updateCam(dt);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
    ctx.clearRect(0, 0, W, H);
    drawSky(GT, dt);
    ctx.save(); Scene.draw(dt, GT); ctx.restore();
    drawSparks(dt);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.globalAlpha = 1; ctx.drawImage(vigCv, 0, 0, W, H);
    requestAnimationFrame(frame);
  }
  resize();
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(resize, 150); });
  if (document.fonts) document.fonts.ready.then(() => { Scene.textRects = null; });
  requestAnimationFrame(frame);

  // Preview helper: #t=12 jumps into the timeline
  const mt = location.hash.match(/t=([\d.]+)/);
  if (mt) { Scene.begun = true; begin.classList.add("hide"); Scene.start(); Scene.t = +mt[1]; }
})();
</script>
</body>
</html>
