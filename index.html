<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merry Christmas, Akari</title>
<meta name="description" content="A little Christmas surprise for Akari.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #070b1f;
    --sky-mid: #131c44;
    --sky-low: #2a2357;
    --gold: #ffd77a;
    --gold-deep: #e9a93a;
    --red: #e23a4e;
    --rose: #ff8fab;
    --snow: #f4f8ff;
    --ink: #2b1d1d;
    --paper: #fff8ec;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    min-height: 100vh;
    overflow-x: hidden;
    background: radial-gradient(ellipse at 50% 110%, var(--sky-low) 0%, var(--sky-mid) 45%, var(--sky-top) 100%);
    background-color: var(--sky-top);
    color: var(--snow);
    font-family: "Cormorant Garamond", Georgia, serif;
    -webkit-tap-highlight-color: transparent;
  }

  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #sky { z-index: 0; }
  #snow { z-index: 6; pointer-events: none; }

  /* Aurora */
  .aurora { position: fixed; inset: -20% -10% auto; height: 70vh; z-index: 1; pointer-events: none; filter: blur(60px); opacity: .55; }
  .aurora span { position: absolute; border-radius: 50%; mix-blend-mode: screen; animation: drift 18s ease-in-out infinite alternate; }
  .aurora span:nth-child(1) { width: 60vw; height: 22vh; left: 5%;  top: 30%; background: #2fe6a8; }
  .aurora span:nth-child(2) { width: 50vw; height: 18vh; left: 40%; top: 20%; background: #5b8cff; animation-duration: 22s; animation-delay: -6s; }
  .aurora span:nth-child(3) { width: 40vw; height: 16vh; left: 60%; top: 40%; background: #c06bff; animation-duration: 26s; animation-delay: -12s; }
  @keyframes drift {
    0%   { transform: translate(0,0) rotate(-6deg) scaleX(1); }
    50%  { transform: translate(6vw,3vh) rotate(4deg) scaleX(1.25); }
    100% { transform: translate(-5vw,-2vh) rotate(-2deg) scaleX(.9); }
  }

  /* Moon + sleigh */
  .moon {
    position: fixed; top: 7vh; right: 9vw; width: clamp(70px, 11vw, 130px); aspect-ratio: 1; border-radius: 50%; z-index: 2;
    background: radial-gradient(circle at 35% 35%, #fffef5 0%, #f6efd2 55%, #d9cfa8 100%);
    box-shadow: 0 0 40px 12px rgba(255,248,210,.35), 0 0 120px 40px rgba(255,248,210,.15);
    animation: moonGlow 6s ease-in-out infinite;
  }
  .moon::before, .moon::after { content: ""; position: absolute; border-radius: 50%; background: rgba(190,178,140,.35); }
  .moon::before { width: 18%; height: 18%; top: 28%; left: 55%; }
  .moon::after  { width: 11%; height: 11%; top: 60%; left: 32%; }
  @keyframes moonGlow { 50% { box-shadow: 0 0 55px 18px rgba(255,248,210,.45), 0 0 150px 55px rgba(255,248,210,.2); } }

  .sleigh {
    position: fixed; top: 12vh; left: 0; z-index: 3; font-size: clamp(18px, 3vw, 30px); white-space: nowrap; pointer-events: none;
    filter: drop-shadow(0 0 6px rgba(255,230,160,.8));
    animation: fly 24s linear infinite; animation-delay: 4s; opacity: 0;
  }
  @keyframes fly {
    0%   { transform: translate(105vw, 6vh) rotate(-4deg); opacity: 0; }
    3%   { opacity: 1; }
    18%  { transform: translate(40vw, -2vh) rotate(3deg); }
    34%  { opacity: 1; }
    37%  { opacity: 0; transform: translate(-30vw, 4vh) rotate(-3deg); }
    100% { opacity: 0; transform: translate(-30vw, 4vh); }
  }

  /* Snowy hills */
  .hills { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; height: 26vh; z-index: 3; pointer-events: none; }

  /* Layout */
  main {
    position: relative; z-index: 4; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    padding: 5vh 16px 4vh; text-align: center;
  }

  h1 { font-weight: 700; line-height: 1; letter-spacing: .04em; }
  .merry {
    display: block; font-size: clamp(34px, 8vw, 84px); text-transform: uppercase;
    filter: drop-shadow(0 0 18px rgba(255,210,120,.45));
  }
  .merry .ch {
    background: linear-gradient(180deg, #fff6d6 10%, var(--gold) 55%, var(--gold-deep) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    display: inline-block; opacity: 0; transform: translateY(-60px) rotate(-12deg); animation: drop .9s cubic-bezier(.2,1.6,.4,1) forwards; }
  @keyframes drop { to { opacity: 1; transform: none; } }

  .name {
    display: block; margin-top: .1em; font-family: "Great Vibes", cursive; font-weight: 400;
    font-size: clamp(64px, min(16vw, 17vh), 170px); color: #ffe9f0; letter-spacing: 0;
    text-shadow: 0 0 12px rgba(255,143,171,.9), 0 0 40px rgba(255,90,130,.6), 0 0 80px rgba(255,90,130,.35);
    opacity: 0; clip-path: inset(-40% 100% -40% -10%); animation: write 2.4s ease-out 1.8s forwards, shimmer 4s ease-in-out 4.2s infinite;
  }
  @keyframes write { to { opacity: 1; clip-path: inset(-40% -10% -40% -10%); } }
  @keyframes shimmer { 50% { text-shadow: 0 0 18px rgba(255,180,200,1), 0 0 60px rgba(255,90,130,.8), 0 0 110px rgba(255,90,130,.45); } }

  .sub {
    margin-top: .4em; font-style: italic; font-size: clamp(17px, 2.6vw, 24px); color: #dfe6ff; opacity: 0;
    animation: fadeUp 1.2s ease 3.6s forwards;
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

  /* Tree */
  .scene { position: relative; margin-top: 2vh; width: min(360px, 78vw, 46vh); }
  .tree { width: 100%; height: auto; overflow: visible; display: block; }
  .tier { transform-origin: 150px 360px; transform: scale(0); animation: grow 1s cubic-bezier(.3,1.5,.5,1) forwards; }
  .tier.t3 { animation-delay: .4s; } .tier.t2 { animation-delay: .7s; } .tier.t1 { animation-delay: 1s; }
  @keyframes grow { to { transform: scale(1); } }
  .trunk { opacity: 0; animation: fadeUp .6s ease .2s forwards; }
  .star { transform-origin: 150px 42px; transform: scale(0); animation: starIn 1s cubic-bezier(.3,1.8,.5,1) 1.6s forwards, starPulse 2.4s ease-in-out 2.6s infinite; }
  @keyframes starIn { from { transform: scale(0) rotate(-180deg); } to { transform: scale(1) rotate(0); } }
  @keyframes starPulse { 50% { transform: scale(1.15); } }
  .rays { transform-origin: 150px 42px; animation: spin 14s linear infinite; opacity: 0; animation-delay: 2s; }
  .rays.on { opacity: .8; transition: opacity 1s; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .bulb { opacity: 0; animation: twinkle var(--d, 1.6s) ease-in-out var(--delay, 0s) infinite; }
  @keyframes twinkle { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  .ornament { transform-box: fill-box; transform-origin: 50% 0; opacity: 0; animation: hang .8s ease var(--delay, 2s) forwards, sway 3s ease-in-out calc(var(--delay, 2s) + .8s) infinite; }
  @keyframes hang { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }
  @keyframes sway { 50% { transform: rotate(6deg); } }
  .garland { stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 2s ease 1.6s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }

  /* Gift */
  .gift {
    position: absolute; right: -14%; bottom: -2%; width: 30%; aspect-ratio: 1; cursor: pointer; border: 0; background: none;
    opacity: 0; animation: fadeUp .8s ease 3s forwards, bounce 2.2s ease-in-out 4s infinite;
  }
  .gift:focus-visible { outline: 2px dashed var(--gold); outline-offset: 6px; border-radius: 8px; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-10px) rotate(-3deg); } }
  .gift svg { width: 100%; height: 100%; overflow: visible; }
  .gift .lid { transition: transform .7s cubic-bezier(.3,1.4,.5,1); transform-origin: 50% 100%; transform-box: fill-box; }
  .gift.open .lid { transform: translate(18px, -60px) rotate(25deg); }
  .gift.open { animation: none; opacity: 1; }
  .hint {
    position: absolute; right: -16%; bottom: 30%; font-size: clamp(14px, 2vw, 17px); font-style: italic; color: var(--gold); white-space: nowrap;
    opacity: 0; animation: fadeUp .8s ease 4.4s forwards; pointer-events: none;
  }
  .hint::after { content: " ↓"; }
  .gift.open ~ .hint { display: none; }

  .presents { position: absolute; left: -10%; bottom: -1%; width: 22%; opacity: 0; animation: fadeUp .8s ease 3.2s forwards; }

  /* Countdown + music */
  .bar { margin-top: 4vh; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: center; opacity: 0; animation: fadeUp 1s ease 4s forwards; }
  .pill {
    font: inherit; font-size: 18px; color: var(--snow); padding: 10px 20px; border-radius: 999px;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.22); backdrop-filter: blur(6px);
  }
  button.pill { cursor: pointer; transition: background .2s, transform .2s; }
  button.pill:hover { background: rgba(255,255,255,.16); transform: translateY(-2px); }
  .pill b { color: var(--gold); }

  /* Letter */
  .overlay {
    position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px;
    background: rgba(5,8,25,.6); backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity .5s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .letter {
    position: relative; width: min(560px, 100%); max-height: 86vh; overflow-y: auto; padding: 40px 32px 32px;
    background: linear-gradient(180deg, #fffdf6, var(--paper)); color: var(--ink); border-radius: 14px; text-align: left;
    box-shadow: 0 30px 80px rgba(0,0,0,.5), inset 0 0 0 6px #fff, inset 0 0 0 8px #e8c98a;
    transform: translateY(40px) scale(.92) rotate(-1.5deg); transition: transform .7s cubic-bezier(.3,1.4,.5,1);
  }
  .overlay.show .letter { transform: none; }
  .letter h2 { font-family: "Great Vibes", cursive; font-weight: 400; font-size: 46px; color: #b8213a; margin-bottom: 10px; }
  .letter p { font-size: 20px; line-height: 1.55; white-space: pre-wrap; min-height: 9em; }
  .letter p .caret { display: inline-block; width: 2px; height: 1em; background: #b8213a; vertical-align: -2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .letter .sign { margin-top: 18px; text-align: right; font-family: "Great Vibes", cursive; font-size: 34px; color: #b8213a; opacity: 0; transition: opacity 1s; }
  .letter .sign.show { opacity: 1; }
  .close { position: absolute; top: 10px; right: 14px; background: none; border: 0; font-size: 30px; line-height: 1; color: #9a6a5a; cursor: pointer; }
  .holly { position: absolute; top: -18px; left: -14px; font-size: 40px; transform: rotate(-20deg); }

  footer { position: relative; z-index: 4; margin-top: auto; padding-top: 3vh; font-size: 15px; color: rgba(230,236,255,.6); font-style: italic; }

  @media (max-width: 560px) {
    .gift { right: -6%; width: 32%; }
    .hint { right: -4%; bottom: 34%; }
    .presents { left: -4%; }
    .letter { padding: 34px 22px 24px; }
    .letter p { font-size: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    .sleigh { display: none; }
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="aurora" aria-hidden="true"><span></span><span></span><span></span></div>
<div class="moon" aria-hidden="true"></div>
<div class="sleigh" aria-hidden="true">🎅🛷🦌🦌🦌</div>

<svg class="hills" viewBox="0 0 1440 300" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <linearGradient id="snowG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9f0ff"/><stop offset="1" stop-color="#9fb2e0"/></linearGradient>
    <linearGradient id="snowG2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c3d1f2"/></linearGradient>
  </defs>
  <path d="M0 150 C 220 80 420 190 720 130 S 1200 70 1440 140 L1440 300 L0 300 Z" fill="url(#snowG)" opacity=".75"/>
  <path d="M0 210 C 300 150 520 250 860 200 S 1300 170 1440 210 L1440 300 L0 300 Z" fill="url(#snowG2)"/>
</svg>

<main>
  <h1>
    <span class="merry" id="merry" aria-label="Merry Christmas">Merry Christmas</span>
    <span class="name">Akari</span>
  </h1>
  <p class="sub">to the light of my life, my love, my everything ✨</p>

  <div class="scene">
    <svg class="tree" id="tree" viewBox="0 0 300 380" aria-label="A glowing Christmas tree">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2fa463"/><stop offset="1" stop-color="#0f5a36"/></linearGradient>
        <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#28965a"/><stop offset="1" stop-color="#0c4d2f"/></linearGradient>
        <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#218a51"/><stop offset="1" stop-color="#093f26"/></linearGradient>
        <radialGradient id="starG"><stop offset="0" stop-color="#fffbe6"/><stop offset=".6" stop-color="#ffd77a"/><stop offset="1" stop-color="#e9a93a"/></radialGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="bigGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <ellipse cx="150" cy="368" rx="120" ry="10" fill="#000" opacity=".25"/>
      <rect class="trunk" x="134" y="328" width="32" height="42" rx="4" fill="#6b4430"/>
      <g class="tier t3"><path d="M150 160 L18 340 Q150 358 282 340 Z" fill="url(#g3)"/><path d="M18 340 Q150 358 282 340" stroke="#eaf3ff" stroke-width="6" fill="none" stroke-linecap="round" opacity=".9"/></g>
      <g class="tier t2"><path d="M150 96 L40 254 Q150 270 260 254 Z" fill="url(#g2)"/><path d="M40 254 Q150 270 260 254" stroke="#eaf3ff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".9"/></g>
      <g class="tier t1"><path d="M150 44 L64 170 Q150 184 236 170 Z" fill="url(#g1)"/><path d="M64 170 Q150 184 236 170" stroke="#eaf3ff" stroke-width="4" fill="none" stroke-linecap="round" opacity=".9"/></g>
      <g fill="none" stroke="#ffd77a" stroke-width="2" opacity=".85" filter="url(#glow)">
        <path class="garland" d="M98 120 Q150 150 206 128"/>
        <path class="garland" d="M70 210 Q150 248 232 206"/>
        <path class="garland" d="M44 296 Q150 340 258 292"/>
      </g>
      <g id="bulbs" filter="url(#glow)"></g>
      <g id="ornaments"></g>
      <g class="rays" id="rays" stroke="#ffe7a8" stroke-width="2" stroke-linecap="round" opacity="0">
        <line x1="150" y1="2" x2="150" y2="14"/><line x1="150" y1="70" x2="150" y2="82"/>
        <line x1="110" y1="42" x2="122" y2="42"/><line x1="178" y1="42" x2="190" y2="42"/>
        <line x1="122" y1="14" x2="130" y2="22"/><line x1="170" y1="62" x2="178" y2="70"/>
        <line x1="178" y1="14" x2="170" y2="22"/><line x1="130" y1="62" x2="122" y2="70"/>
      </g>
      <polygon class="star" filter="url(#bigGlow)" fill="url(#starG)"
        points="150,18 157,35 176,36 161,48 166,66 150,56 134,66 139,48 124,36 143,35"/>
    </svg>

    <svg class="presents" viewBox="0 0 100 80" aria-hidden="true">
      <rect x="4" y="34" width="44" height="44" rx="3" fill="#3f7be0"/><rect x="22" y="34" width="8" height="44" fill="#ffd77a"/>
      <rect x="2" y="28" width="48" height="10" rx="2" fill="#5590f0"/><rect x="22" y="28" width="8" height="10" fill="#ffd77a"/>
      <rect x="52" y="48" width="40" height="30" rx="3" fill="#e9a93a"/><rect x="68" y="48" width="8" height="30" fill="#e23a4e"/>
      <rect x="50" y="42" width="44" height="9" rx="2" fill="#f4bf5a"/><rect x="68" y="42" width="8" height="9" fill="#e23a4e"/>
    </svg>

    <button class="gift" id="gift" aria-label="Open your present">
      <svg viewBox="0 0 100 100">
        <rect x="14" y="44" width="72" height="54" rx="4" fill="#e23a4e"/>
        <rect x="44" y="44" width="12" height="54" fill="#ffd77a"/>
        <g class="lid">
          <rect x="8" y="30" width="84" height="18" rx="3" fill="#f0566a"/>
          <rect x="44" y="30" width="12" height="18" fill="#ffd77a"/>
          <path d="M50 30 C 30 6 18 22 40 30 Z" fill="#ffd77a"/><path d="M50 30 C 70 6 82 22 60 30 Z" fill="#ffd77a"/>
          <circle cx="50" cy="29" r="5" fill="#e9a93a"/>
        </g>
      </svg>
    </button>
    <span class="hint">open me</span>
  </div>

  <div class="bar">
    <span class="pill" id="countdown"></span>
    <button class="pill" id="music" aria-pressed="false">🔔 Play music</button>
  </div>

  <footer>tap anywhere for a little magic ✦</footer>
</main>

<canvas id="snow"></canvas>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="letterTitle">
  <div class="letter">
    <span class="holly" aria-hidden="true">🎄</span>
    <button class="close" id="close" aria-label="Close letter">×</button>
    <h2 id="letterTitle">My dearest Akari,</h2>
    <p id="letterText"></p>
    <div class="sign" id="sign">Forever yours ♥</div>
  </div>
</div>

<script>
(() => {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- Letter-by-letter title ---------- */
  const merry = document.getElementById("merry");
  const words = merry.textContent;
  merry.textContent = "";
  [...words].forEach((c, i) => {
    const s = document.createElement("span");
    s.className = "ch";
    s.setAttribute("aria-hidden", "true");
    s.textContent = c === " " ? " " : c;
    s.style.animationDelay = (0.08 * i) + "s";
    merry.appendChild(s);
  });

  /* ---------- Tree lights & ornaments ---------- */
  const NS = "http://www.w3.org/2000/svg";
  const bulbs = document.getElementById("bulbs");
  const orns = document.getElementById("ornaments");
  const colors = ["#ff5d73", "#ffd77a", "#7ce8ff", "#b892ff", "#7dffb0", "#ffffff"];
  // Tier triangles: [apexY, baseY, baseHalfWidth]
  const tiers = [[44, 168, 86], [96, 252, 110], [160, 338, 132]];
  function insideTree(x, y) {
    return tiers.some(([a, b, w]) => y > a + 14 && y < b - 6 && Math.abs(x - 150) < (w * (y - a) / (b - a)) - 8);
  }
  let placed = 0, tries = 0;
  while (placed < 46 && tries < 3000) {
    tries++;
    const x = 20 + Math.random() * 260, y = 60 + Math.random() * 275;
    if (!insideTree(x, y)) continue;
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", x); c.setAttribute("cy", y); c.setAttribute("r", 2.6 + Math.random() * 1.4);
    c.setAttribute("fill", colors[placed % colors.length]);
    c.setAttribute("class", "bulb");
    c.style.setProperty("--d", (1 + Math.random() * 1.8) + "s");
    c.style.setProperty("--delay", (2 + Math.random() * 2) + "s");
    bulbs.appendChild(c); placed++;
  }
  const ornSpots = [[120, 140], [182, 150], [150, 118], [92, 228], [208, 230], [150, 214], [128, 246], [70, 312], [232, 314], [110, 300], [190, 296], [150, 320]];
  const ornColors = ["#e23a4e", "#ffd77a", "#4f8cff", "#c06bff", "#e23a4e", "#ffd77a"];
  ornSpots.forEach(([x, y], i) => {
    const g = document.createElementNS(NS, "g");
    g.setAttribute("class", "ornament");
    g.style.setProperty("--delay", (2.2 + i * 0.12) + "s");
    const col = ornColors[i % ornColors.length];
    g.innerHTML = `<line x1="${x}" y1="${y - 12}" x2="${x}" y2="${y - 7}" stroke="#ffe7a8" stroke-width="1"/>
      <rect x="${x - 2.5}" y="${y - 9}" width="5" height="3" fill="#d9b25c"/>
      <circle cx="${x}" cy="${y}" r="7" fill="${col}"/>
      <circle cx="${x - 2.4}" cy="${y - 2.4}" r="2.2" fill="#fff" opacity=".7"/>`;
    orns.appendChild(g);
  });
  setTimeout(() => document.getElementById("rays").classList.add("on"), 2600);

  /* ---------- Starry sky (back canvas) ---------- */
  const sky = document.getElementById("sky"), sctx = sky.getContext("2d");
  const snow = document.getElementById("snow"), fctx = snow.getContext("2d");
  let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
  let stars = [], flakes = [], sparks = [], shooting = null;

  function resize() {
    W = innerWidth; H = innerHeight;
    [sky, snow].forEach(cv => { cv.width = W * DPR; cv.height = H * DPR; });
    sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    fctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    stars = Array.from({ length: Math.round(W * H / 3500) }, () => ({
      x: Math.random() * W, y: Math.random() * H * 0.8, r: Math.random() * 1.3 + 0.2,
      p: Math.random() * Math.PI * 2, s: 0.5 + Math.random() * 2
    }));
    const n = Math.round(Math.min(220, W * H / 7000));
    flakes = Array.from({ length: n }, () => newFlake(true));
  }
  function newFlake(anywhere) {
    const z = Math.random();
    return {
      x: Math.random() * W, y: anywhere ? Math.random() * H : -10,
      r: 0.8 + z * 3.2, vy: 0.4 + z * 1.4, sway: Math.random() * Math.PI * 2,
      sw: 0.3 + Math.random() * 0.8, a: 0.35 + z * 0.6
    };
  }

  /* ---------- Click sparkles & hearts ---------- */
  function burst(x, y, count = 26, hearts = false) {
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2, sp = 1.5 + Math.random() * 4.5;
      sparks.push({
        x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 1.5, life: 1,
        decay: 0.012 + Math.random() * 0.015, size: hearts ? 10 + Math.random() * 12 : 2 + Math.random() * 2.5,
        heart: hearts || Math.random() < 0.3, color: hearts ? ["#ff5d8f", "#ff8fab", "#ffd1dc", "#e23a4e"][i % 4] : colors[i % colors.length]
      });
    }
  }
  function drawHeart(ctx, x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.3);
    ctx.bezierCurveTo(x, y, x - s * 0.5, y, x - s * 0.5, y + s * 0.3);
    ctx.bezierCurveTo(x - s * 0.5, y + s * 0.6, x, y + s * 0.8, x, y + s);
    ctx.bezierCurveTo(x, y + s * 0.8, x + s * 0.5, y + s * 0.6, x + s * 0.5, y + s * 0.3);
    ctx.bezierCurveTo(x + s * 0.5, y, x, y, x, y + s * 0.3);
    ctx.fill();
  }

  let t = 0;
  function frame() {
    t += 1;
    // Sky
    sctx.clearRect(0, 0, W, H);
    for (const s of stars) {
      const a = 0.35 + 0.65 * Math.abs(Math.sin(s.p + t * 0.01 * s.s));
      sctx.globalAlpha = a; sctx.fillStyle = "#fff";
      sctx.beginPath(); sctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); sctx.fill();
    }
    sctx.globalAlpha = 1;
    if (!shooting && Math.random() < 0.004) shooting = { x: Math.random() * W * 0.7, y: Math.random() * H * 0.3, len: 0, life: 1 };
    if (shooting) {
      const sh = shooting; sh.x += 9; sh.y += 4; sh.len = Math.min(sh.len + 14, 140); sh.life -= 0.02;
      const g = sctx.createLinearGradient(sh.x, sh.y, sh.x - sh.len, sh.y - sh.len * 0.45);
      g.addColorStop(0, `rgba(255,255,255,${sh.life})`); g.addColorStop(1, "rgba(255,255,255,0)");
      sctx.strokeStyle = g; sctx.lineWidth = 2;
      sctx.beginPath(); sctx.moveTo(sh.x, sh.y); sctx.lineTo(sh.x - sh.len, sh.y - sh.len * 0.45); sctx.stroke();
      if (sh.life <= 0) shooting = null;
    }

    // Snow + sparks
    fctx.clearRect(0, 0, W, H);
    fctx.fillStyle = "#fff";
    for (let i = 0; i < flakes.length; i++) {
      const f = flakes[i];
      f.y += f.vy; f.sway += 0.01 * f.sw; f.x += Math.sin(f.sway) * 0.6;
      if (f.y > H + 10 || f.x < -10 || f.x > W + 10) flakes[i] = newFlake(false);
      fctx.globalAlpha = f.a;
      fctx.beginPath(); fctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); fctx.fill();
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.vx *= 0.985; p.life -= p.decay;
      if (p.life <= 0) { sparks.splice(i, 1); continue; }
      fctx.globalAlpha = p.life; fctx.fillStyle = p.color;
      fctx.shadowColor = p.color; fctx.shadowBlur = 10;
      if (p.heart) drawHeart(fctx, p.x, p.y, p.size * (p.size > 6 ? 1 : 3));
      else { fctx.beginPath(); fctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); fctx.fill(); }
      fctx.shadowBlur = 0;
    }
    fctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  resize();
  addEventListener("resize", resize);
  if (!reduce) requestAnimationFrame(frame); else { frame(); }

  document.addEventListener("pointerdown", e => {
    if (e.target.closest(".overlay, .gift, button")) return;
    burst(e.clientX, e.clientY, 22, false);
  });

  /* ---------- Gift + letter ---------- */
  const message =
`Merry Christmas, my love.

Of all the gifts life has ever given me, you are the most beautiful one. Your smile lights up my world brighter than every star in this sky, and your laugh is my favorite song.

Thank you for your kindness, your patience, and for loving me the way you do. Every day with you feels like Christmas morning.

I promise to keep holding your hand through every winter, every adventure, and every ordinary little day — because with you, none of them are ordinary.

I love you more than words could ever say.`;

  const gift = document.getElementById("gift");
  const overlay = document.getElementById("overlay");
  const textEl = document.getElementById("letterText");
  const sign = document.getElementById("sign");
  let typing = null;

  function typeLetter() {
    clearInterval(typing);
    textEl.textContent = ""; sign.classList.remove("show");
    const caret = document.createElement("span"); caret.className = "caret";
    const node = document.createTextNode("");
    textEl.append(node, caret);
    let i = 0;
    if (reduce) { node.data = message; caret.remove(); sign.classList.add("show"); return; }
    typing = setInterval(() => {
      node.data = message.slice(0, ++i);
      if (i >= message.length) { clearInterval(typing); caret.remove(); sign.classList.add("show"); }
    }, 32);
  }

  gift.addEventListener("click", () => {
    gift.classList.add("open");
    const r = gift.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 3, 40, true);
    burst(r.left + r.width / 2, r.top + r.height / 3, 30, false);
    chime();
    setTimeout(() => { overlay.classList.add("show"); typeLetter(); document.getElementById("close").focus(); }, 900);
  });
  function closeLetter() {
    overlay.classList.remove("show");
    clearInterval(typing);
    burst(innerWidth / 2, innerHeight / 2, 30, true);
    setTimeout(() => gift.classList.remove("open"), 600);
  }
  document.getElementById("close").addEventListener("click", closeLetter);
  overlay.addEventListener("click", e => { if (e.target === overlay) closeLetter(); });
  addEventListener("keydown", e => { if (e.key === "Escape" && overlay.classList.contains("show")) closeLetter(); });

  /* ---------- Countdown ---------- */
  const cd = document.getElementById("countdown");
  function updateCountdown() {
    const now = new Date();
    if (now.getMonth() === 11 && now.getDate() === 25) { cd.innerHTML = "🎄 <b>It's Christmas!</b> 🎄"; return; }
    let xmas = new Date(now.getFullYear(), 11, 25);
    if (now > xmas) xmas = new Date(now.getFullYear() + 1, 11, 25);
    const days = Math.ceil((xmas - now) / 86400000);
    cd.innerHTML = `🎁 <b>${days}</b> day${days === 1 ? "" : "s"} until Christmas`;
  }
  updateCountdown(); setInterval(updateCountdown, 60000);

  /* ---------- Music: bell-tone "We Wish You a Merry Christmas" (public domain) ---------- */
  const N = { D4: 293.66, E4: 329.63, Fs4: 369.99, G4: 392, A4: 440, B4: 493.88, C5: 523.25, D5: 587.33 };
  const song = [
    ["D4",1],["G4",1],["G4",.5],["A4",.5],["G4",.5],["Fs4",.5],["E4",1],["E4",1],
    ["E4",1],["A4",1],["A4",.5],["B4",.5],["A4",.5],["G4",.5],["Fs4",1],["D4",1],
    ["D4",1],["B4",1],["B4",.5],["C5",.5],["B4",.5],["A4",.5],["G4",1],["E4",1],
    ["D4",.5],["D4",.5],["E4",1],["A4",1],["Fs4",1],["G4",2],[null,2]
  ];
  let actx = null, master = null, playing = false, timer = null;
  function bell(freq, when, dur, vol = 0.22) {
    [1, 2, 3.01].forEach((m, k) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = k === 0 ? "triangle" : "sine";
      o.frequency.value = freq * m;
      const v = vol / (k * 2 + 1);
      g.gain.setValueAtTime(0.0001, when);
      g.gain.exponentialRampToValueAtTime(v, when + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, when + dur * 1.8 + 0.4);
      o.connect(g).connect(master);
      o.start(when); o.stop(when + dur * 1.8 + 0.5);
    });
  }
  function ensureAudio() {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain(); master.gain.value = 0.7; master.connect(actx.destination);
    }
    if (actx.state === "suspended") actx.resume();
  }
  function playLoop() {
    const beat = 0.42;
    let when = actx.currentTime + 0.1, total = 0;
    for (const [n, b] of song) {
      if (n) bell(N[n], when, b * beat);
      when += b * beat; total += b * beat;
    }
    timer = setTimeout(() => { if (playing) playLoop(); }, total * 1000);
  }
  function chime() {
    try {
      ensureAudio();
      const now = actx.currentTime;
      ["G4","B4","D5"].forEach((n, i) => bell(N[n] * 2, now + i * 0.09, 0.4, 0.12));
    } catch (_) {}
  }
  const musicBtn = document.getElementById("music");
  musicBtn.addEventListener("click", () => {
    ensureAudio();
    playing = !playing;
    musicBtn.setAttribute("aria-pressed", playing);
    musicBtn.textContent = playing ? "🔕 Pause music" : "🔔 Play music";
    if (playing) playLoop();
    else {
      clearTimeout(timer);
      const old = master;
      old.gain.setTargetAtTime(0, actx.currentTime, 0.05);
      setTimeout(() => old.disconnect(), 400);
      master = actx.createGain(); master.gain.value = 0.7; master.connect(actx.destination);
    }
  });
})();
</script>
</body>
</html>
